server {
    listen 80;

    # Serve the built React static files
    location / {
        root /usr/share/nginx/html;
        # Needed for React single-page app — unknown paths fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend container
    # 'backend' matches the service name in docker-compose.yml
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
