<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes Application</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 24px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
        }
        .note-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 16px;
            resize: vertical;
            min-height: 60px;
        }
        .notes-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .note-item {
            background: #f1f1f1;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 4px;
            color: #444;
        }
        .add-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s;
        }
        .add-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Notes</h1>
        <textarea class="note-input" placeholder="Write your note here..." disabled></textarea>
        <button class="add-btn" disabled>Add Note</button>
        <ul class="notes-list">
            <li class="note-item">Note entry 1</li>
        </ul>
    </div>
</body>
</html>
